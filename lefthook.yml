pre-commit:
  commands:
    app-format:
      glob: "next-app/**/*.{ts,tsx,js,jsx,json,css,md}"
      run: bash -c "cd next-app && npx prettier --write $(git diff --cached --name-only --diff-filter=ACM | grep -E '^next-app/.*\\.(ts|tsx|js|jsx|json|css|md)$')"
      skip: [merge-commit]

    app-typecheck:
      glob: "next-app/**/*.{ts,tsx}"
      run: bash -c "cd next-app && npx tsc --noEmit"
      skip: [merge-commit]

    supabase-format:
      glob: "supabase_project/**/*.ts"
      run: bash -c "cd supabase_project && npx prettier --write $(git diff --cached --name-only --diff-filter=ACM | grep -E '\\.(ts|js)$')"
      skip: [merge-commit]

    supabase-lint:
      glob: "supabase_project/**/*.ts"
      run: bash -c "cd supabase_project && npx eslint $(git diff --cached --name-only --diff-filter=ACM | grep -E '\\.(ts|js)$') || true"
      skip: [merge-commit]
